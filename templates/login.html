{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-3xl font-bold mb-6 text-gray-900">Login</h1>

    <form method="post" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg text-sm">
          {{ form.non_field_errors }}
        </div>
      {% endif %}

      <div>
        <label for="id_username" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
        <input
          type="email"
          name="username"
          id="id_username"
          value="{{ form.username.value|default:'' }}"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg"
          required
        >
      </div>

      <div>
        <label for="id_password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input
          type="password"
          name="password"
          id="id_password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg"
          required
        >
      </div>

      {% comment %}
      <div class="text-right">
        <a href="{% url 'password_reset' %}" class="text-sm text-red-600 hover:text-red-700">
          Forgot password?
        </a>
      </div>
      {% endcomment %}

      <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">
        Login
      </button>

      <p class="text-sm text-center text-gray-600">
        Don't have an account?
        <a href="{% url 'register' %}" class="font-semibold text-red-600 hover:text-red-700 hover:underline">
          Create one
        </a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
