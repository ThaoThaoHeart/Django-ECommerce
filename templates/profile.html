{% extends 'base.html' %}

{% block title %}Profile - Django E-commerce{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-900">My Profile</h1>

        <!-- User Info Card -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Account Information</h2>
            <div class="space-y-3">
                <div class="flex justify-between border-b pb-2">
                    <span class="font-medium text-gray-700">Email:</span>
                    <span class="text-gray-600">{{ user.email|default:"Not set" }}</span>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-red-50 rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Actions</h2>
            <div class="space-y-2">
                <a href="{% url 'home' %}" class="block w-full text-center bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">
                    Continue Shopping
                </a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="block w-full text-center bg-pink-600 text-white py-2 rounded-lg hover:bg-red-700 transition">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
